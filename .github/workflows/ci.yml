name: Validate portfolio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public_files.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_test.py
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [infra/registry, infra/service]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.local -t cloudops-local .
      - run: docker build --platform linux/amd64 --provenance=false -t cloudops-lambda .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose up -d
      - run: python scripts/docker_smoke.py
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
